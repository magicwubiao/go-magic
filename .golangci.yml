run:
  timeout: 5m
  modules-download-mode: readonly

linters:
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gofmt
    - goimports
    - misspell
    - revive
    - unparam
    - unconvert
    - goconst
    - gocritic
    - whitespace
    - prealloc

linters-settings:
  errcheck:
    check-type-assertions: true
    check-blank: true
  govet:
    enable-all: true
  goimports:
    local-prefixes: github.com/magicwubiao/go-magic
  revive:
    rules:
      - name: var-naming
      - name: package-comments
      - name: exported
      - name: context-as-argument
  gocritic:
    enabled-tags:
      - diagnostic
      - performance
      - style
      - experimental
  misspell:
    locale: US

issues:
  exclude-use-default: false
  max-issues-per-linter: 0
  max-same-issues: 0

output:
  format: colored-line-number
  print-issued-lines: true
  print-linter-name: true
