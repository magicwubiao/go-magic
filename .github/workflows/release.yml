name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v1.0.0)'
        required: true
        type: string

env:
  BINARY_NAME: magic
  BUILD_DIR: build

jobs:
  release:
    name: Release ${{ github.ref_name }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.21'
          cache: true

      - name: Get version
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          if [ -z "$VERSION" ]; then
            VERSION="${{ inputs.version }}"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "VERSION_STRIPPED=${VERSION#v}" >> $GITHUB_OUTPUT

      - name: Run tests
        run: go test ./... -v -race

      - name: Run linter
        uses: golangci/golangci-lint-action@v4
        with:
          version: latest

      - name: Build
        run: |
          VERSION=${{ steps.version.outputs.VERSION_STRIPPED }}
          COMMIT=${{ github.sha }}
          DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          LDFLAGS="-X github.com/magicwubiao/go-magic/cmd/magic.Version=${VERSION} -X github.com/magicwubiao/go-magic/cmd/magic.Commit=${COMMIT} -X github.com/magicwubiao/go-magic/cmd/magic.BuildDate=${DATE}"
          
          mkdir -p ${{ env.BUILD_DIR }}
          
          echo "Building Linux AMD64..."
          GOOS=linux GOARCH=amd64 go build $LDFLAGS -o ${{ env.BUILD_DIR }}/${{ env.BINARY_NAME }}-linux-amd64 ./cmd/magic
          
          echo "Building macOS AMD64..."
          GOOS=darwin GOARCH=amd64 go build $LDFLAGS -o ${{ env.BUILD_DIR }}/${{ env.BINARY_NAME }}-darwin-amd64 ./cmd/magic
          
          echo "Building macOS ARM64..."
          GOOS=darwin GOARCH=arm64 go build $LDFLAGS -o ${{ env.BUILD_DIR }}/${{ env.BINARY_NAME }}-darwin-arm64 ./cmd/magic
          
          echo "Building Windows AMD64..."
          GOOS=windows GOARCH=amd64 go build $LDFLAGS -o ${{ env.BUILD_DIR }}/${{ env.BINARY_NAME }}-windows-amd64.exe ./cmd/magic

      - name: Generate checksums
        run: |
          cd ${{ env.BUILD_DIR }}
          sha256sum * > checksums.txt

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.VERSION }}
          name: ${{ steps.version.outputs.VERSION }}
          draft: false
          prerelease: ${{ contains(steps.version.outputs.VERSION, 'alpha') || contains(steps.version.outputs.VERSION, 'beta') || contains(steps.version.outputs.VERSION, 'rc') }}
          generate_release_notes: true
          files: |
            ${{ env.BUILD_DIR }}/*
            !build/*.exe~  # exclude any backup files
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ${{ env.BUILD_DIR }}/${{ env.BINARY_NAME }}-windows-amd64.exe
          asset_name: ${{ env.BINARY_NAME }}-${{ steps.version.outputs.VERSION_STRIPPED }}-windows-amd64.exe
          asset_content_type: application/octet-stream
