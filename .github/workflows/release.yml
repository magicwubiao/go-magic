name: Build Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v1.0.0)'
        required: false
        type: string
  push:
    tags:
      - 'v*'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  GO_VERSION: '1.24'

permissions:
  contents: write  # 允许创建 Release

jobs:
  # 获取版本号
  get-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.VERSION }}
      timestamp: ${{ steps.version.outputs.TIMESTAMP }}
    steps:
      - name: Get version
        id: version
        run: |
          if [ "${{ github.event.inputs.version }}" != "" ]; then
            echo "VERSION=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi
          echo "TIMESTAMP=$(date +"%Y%m%d%H%M%S")" >> $GITHUB_OUTPUT

  # 代码检查和测试（与 CI 保持一致）
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build Web UI (required for embed)
        run: |
          cd web
          npm install
          npm run build

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run go vet
        run: go vet ./...

      - name: Run tests
        run: go test -v -race ./...

  # 多平台交叉编译
  build-cross:
    needs: [lint-and-test, get-version]
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64

    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build Web UI
        run: |
          cd web
          npm install
          npm run build

      - name: Build CLI
        env:
          EXT: ${{ matrix.goos == 'windows' && '.exe' || '' }}
        run: |
          GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} CGO_ENABLED=0 \
          go build -ldflags="-s -w -X main.Version=${{ needs.get-version.outputs.version }}" \
          -o go-magic-${{ matrix.goos }}-${{ matrix.goarch }}${{ env.EXT }} \
          ./cmd/magic

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: go-magic-${{ matrix.goos }}-${{ matrix.goarch }}
          path: go-magic-${{ matrix.goos }}-${{ matrix.goarch }}*

  # 构建 Linux 安装包
  build-linux-packages:
    needs: [lint-and-test, get-version]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build Web UI
        run: |
          cd web
          npm install
          npm run build

      - name: Install fpm
        run: |
          sudo apt-get update
          sudo apt-get install -y ruby ruby-dev build-essential
          sudo gem install fpm --no-document

      - name: Build DEB package
        run: |
          VERSION=${{ needs.get-version.outputs.version }}
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -ldflags="-s -w -X main.Version=$VERSION" -o go-magic ./cmd/magic
          fpm -s dir -t deb -n go-magic -v "${VERSION#v}" -p go-magic_amd64.deb ./go-magic=/usr/bin/go-magic

      - name: Upload DEB artifact
        uses: actions/upload-artifact@v4
        with:
          name: go-magic-deb-package
          path: go-magic_amd64.deb

  # 创建 Release
  create-release:
    needs: [build-cross, build-linux-packages]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true  # 合并所有 artifact 到同一目录

      - name: List artifacts
        run: ls -laR artifacts/

      - name: Create Release
        uses: softprops/action-gh-release@v2  # 升级到 v2
        with:
          files: |
            artifacts/*.exe
            artifacts/go-magic-*
            artifacts/*.deb
          draft: false
          prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') || contains(github.ref, 'rc') }}
          generate_release_notes: true  # 自动生成 Release Notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}