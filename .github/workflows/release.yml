name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v1.0.0)'
        required: true
        type: string

env:
  BINARY_NAME: magic
  BUILD_DIR: build
  GO_VERSION: '1.25'

jobs:
  # =============================================================================
  # Build Matrix
  # =============================================================================
  build:
    name: Build ${{ matrix.platform }}
    runs-on ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux
          - platform: linux-386
            os: linux
            arch: 386
            runner: ubuntu-latest
            archive: tar.gz
          - platform: linux-amd64
            os: linux
            arch: amd64
            runner: ubuntu-latest
            archive: tar.gz
          - platform: linux-armv6
            os: linux
            arch: arm
            runner: ubuntu-latest
            archive: tar.gz
          - platform: linux-arm64
            os: linux
            arch: arm64
            runner: ubuntu-latest
            archive: tar.gz
          - platform: linux-riscv64
            os: linux
            arch: riscv64
            runner: ubuntu-latest
            archive: tar.gz
          - platform: linux-ppc64le
            os: linux
            arch: ppc64le
            runner: ubuntu-latest
            archive: tar.gz
          - platform: linux-s390x
            os: linux
            arch: s390x
            runner: ubuntu-latest
            archive: tar.gz

          # macOS
          - platform: darwin-amd64
            os: darwin
            arch: amd64
            runner: macos-latest
            archive: tar.gz
          - platform: darwin-arm64
            os: darwin
            arch: arm64
            runner: macos-latest
            archive: tar.gz

          # Windows
          - platform: windows-386
            os: windows
            arch: 386
            runner: windows-latest
            archive: zip
          - platform: windows-amd64
            os: windows
            arch: amd64
            runner: windows-latest
            archive: zip
          - platform: windows-arm64
            os: windows
            arch: arm64
            runner: windows-latest
            archive: zip

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Get version
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          if [ -z "$VERSION" ]; then
            VERSION="${{ inputs.version }}"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "VERSION_STRIPPED=${VERSION#v}" >> $GITHUB_OUTPUT

      - name: Build
        run: |
          VERSION=${{ steps.version.outputs.VERSION_STRIPPED }}
          COMMIT=${{ github.sha }}
          DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          OUTPUT_NAME="${{ env.BINARY_NAME }}-${{ matrix.platform }}"
          LDFLAGS="-X main.Version=${VERSION} -X main.Commit=${COMMIT} -X main.BuildDate=${DATE}"

          # Build binary
          GOOS=${{ matrix.os }} GOARCH=${{ matrix.arch }} go build \
            -ldflags="$LDFLAGS" \
            -o "${{ env.BUILD_DIR }}/${OUTPUT_NAME}" \
            ./cmd/magic

          # Create archive
          cd ${{ env.BUILD_DIR }}
          if [[ "${{ matrix.archive }}" == "tar.gz" ]]; then
            tar -czf "${OUTPUT_NAME}.tar.gz" "${OUTPUT_NAME}"
            rm -f "${OUTPUT_NAME}"
          else
            powershell -Command "Compress-Archive -Path '${OUTPUT_NAME}' -DestinationPath '${OUTPUT_NAME}.zip' -Force"
            rm -f "${OUTPUT_NAME}"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: ${{ env.BUILD_DIR }}/*.${{ matrix.archive }}

  # =============================================================================
  # Release
  # =============================================================================
  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: ${{ env.BUILD_DIR }}
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd ${{ env.BUILD_DIR }}
          sha256sum * > checksums.txt
          cat checksums.txt

      - name: Get version
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          if [ -z "$VERSION" ]; then
            VERSION="${{ inputs.version }}"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.VERSION }}
          name: ${{ steps.version.outputs.VERSION }}
          draft: false
          prerelease: ${{ contains(steps.version.outputs.VERSION, 'alpha') || contains(steps.version.outputs.VERSION, 'beta') || contains(steps.version.outputs.VERSION, 'rc') }}
          generate_release_notes: true
          files: |
            ${{ env.BUILD_DIR }}/*

  # =============================================================================
  # Docker
  # =============================================================================
  docker:
    name: Build Docker
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Get version
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          if [ -z "$VERSION" ]; then
            VERSION="${{ inputs.version }}"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/go-magic:${{ steps.version.outputs.VERSION }}
            ${{ secrets.DOCKER_USERNAME }}/go-magic:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # =============================================================================
  # Homebrew
  # =============================================================================
  homebrew:
    name: Update Homebrew
    runs-on: ubuntu-latest
    needs: release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Checkout homebrew-tap
        uses: actions/checkout@v4
        with:
          repository: magicwubiao/homebrew-tap
          path: homebrew-tap
          token: ${{ secrets.HOMEBREW_TOKEN }}

      - name: Get version
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          echo "VERSION=${VERSION#v}" >> $GITHUB_OUTPUT

      - name: Update Homebrew formula
        run: |
          VERSION=${{ steps.version.outputs.VERSION }}
          
          # Update version
          sed -i '' "s/version \".*\"/version \"${VERSION}\"/" homebrew-tap/Formula/magic.rb
          
          # Update download URLs for all platforms
          PLATFORMS=("linux-amd64" "linux-arm64" "darwin-amd64" "darwin-arm64" "windows-amd64")
          for platform in "${PLATFORMS[@]}"; do
            sed -i '' "s|https://github.com/magicwubiao/go-magic/releases/download/.*/magic-${platform}|https://github.com/magicwubiao/go-magic/releases/download/v${VERSION}/magic-${platform}|g" homebrew-tap/Formula/magic.rb
          done
          
          cat homebrew-tap/Formula/magic.rb

      - name: Create pull request
        uses: peter-evans/create-pull-request@v5
        with:
          path: homebrew-tap
          token: ${{ secrets.HOMEBREW_TOKEN }}
          commit-message: "Update magic to v${{ steps.version.outputs.VERSION }}"
          title: "Update magic to v${{ steps.version.outputs.VERSION }}"
          body: "Automated update by GitHub Actions"
          branch: update-magic-${{ steps.version.outputs.VERSION }}
