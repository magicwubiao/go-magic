name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  GO_VERSION: '1.24'

jobs:
  # 代码检查和测试
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build Web UI (required for embed)
        run: |
          cd web
          npm install
          npm run build

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run go vet
        run: go vet ./...

      - name: Run tests
        run: go test -v -race -cover ./...

  # 构建 Web UI
  build-web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: cd web && npm install

      - name: Build Web UI
        run: |
          cd web
          npm run build
          ls -la ../internal/server/dist/

  # 构建 Go CLI (当前平台)
  build-cli:
    needs: build-web
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build Web UI
        run: |
          cd web
          npm install
          npm run build

      - name: Build Go CLI
        run: |
          go build -ldflags="-s -w" -o go-magic ./cmd/magic

      - name: Upload CLI artifact
        uses: actions/upload-artifact@v4
        with:
          name: go-magic-cli-linux-amd64
          path: go-magic
