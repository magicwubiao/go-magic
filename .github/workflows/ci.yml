name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  GO_VERSION: '1.24'

jobs:
  # 代码检查和测试
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build Web UI (required for embed)
        run: |
          cd web
          npm install
          npm run build

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run go vet
        run: go vet ./...

      - name: Run tests
        run: go test -v -race ./...

  # 多平台交叉编译
  build-cross:
    needs: lint-and-test
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64

    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build Web UI
        run: |
          cd web
          npm install
          npm run build

      - name: Build CLI
        env:
          EXT: ${{ matrix.goos == 'windows' && '.exe' || '' }}
        run: |
          GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} CGO_ENABLED=0 \
          go build -ldflags="-s -w" \
          -o go-magic-${{ matrix.goos }}-${{ matrix.goarch }}${{ env.EXT }} \
          ./cmd/magic

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: go-magic-${{ matrix.goos }}-${{ matrix.goarch }}
          path: go-magic-${{ matrix.goos }}-${{ matrix.goarch }}*
