# ===========================================
# go-magic Docker Compose
# One-command deployment
# ===========================================

services:
  # Main application
  magic:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: go-magic
    restart: unless-stopped
    ports:
      # `magic server` 默认端口是 5000；镜像 CMD 已显式指定 --port 8642，
      # 因此这里映射 8642 才对得上。若覆盖 command，请同步修改端口。
      - "8642:8642"   # API / Web UI
      - "8643:8643"   # 预留，当前无服务监听（仅出现在 CORS 允许源里）
      #
      # 网关平台 webhook 回调端口：各平台各自独立监听，不经由 8643。
      # 只用到了某个平台时才需要放开对应端口；用不到的可以整行删掉，
      # 以免无谓地对外暴露端口（回调服务器要求能从公网访问）。
      - "8091:8091"   # 钉钉 dingtalk
      - "8092:8092"   # 飞书 feishu
      - "8084:8084"   # Discord
      - "8085:8085"   # Slack
      - "8087:8087"   # LINE
      - "8088:8088"   # Teams
      - "8089:8089"   # Google Chat
      - "8090:8090"   # SMS (Twilio)
    environment:
      - TZ=UTC
    volumes:
      - magic-config:/home/magic/.magic
    networks:
      - magic-network
    healthcheck:
      # 与 Dockerfile 的 HEALTHCHECK 保持一致（curl 已装在镜像里）。
      #
      # 更正一条历史结论：此前这里注释称 `/api/health` 不支持 HEAD，所以
      # 用 `wget --spider` 会误报。经查源码并非如此——
      #   internal/server/server.go: mux.HandleFunc("/api/health", withCORS(s.handleHealth))
      #   internal/server/health.go:  handler 完全不读 r.Method，GET/HEAD 都回 200
      # 也就是说探测方式本身不是「方法不兼容」问题。若出现过 unhealthy，
      # 更可能是探测工具（busybox wget 版本差异）或启动时序问题，需实测确认，
      # 不要再把「HEAD 不被支持」当成原因。
      #
      # start_period 此处 10s（镜像内为 5s），留给首次初始化 ~/.magic 的时间。
      test: ["CMD", "curl", "-sf", "http://localhost:8642/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # 本项目不使用 Redis / 外部缓存服务：
  #   - 持久化走 SQLite（modernc.org/sqlite，纯 Go 无 CGO）
  #   - 缓存是进程内 map（internal/tool/cache.go 的 InMemoryToolCache / TTLCache）
  #   - go.mod 中不存在任何 Redis 客户端依赖，全仓代码也没有 6379 相关引用
  # 这里曾有一个 redis 服务，但代码从未连接它，属于孤立服务：
  # 只会白起一个容器、白占一个数据卷，还需靠「只绑回环」来规避其默认无鉴权的风险。
  # 若将来要重新引入，请先让代码真正使用它，再加回来。

networks:
  magic-network:
    driver: bridge

volumes:
  magic-config:
