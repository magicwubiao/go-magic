# ===========================================
# go-magic Docker Compose
# One-command deployment
# ===========================================

services:
  # Main application
  magic:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: go-magic
    restart: unless-stopped
    ports:
      # `magic server` defaults to port 5000; the image CMD already passes --port 8642
      # explicitly, so mapping 8642 here is what lines up. If you override command,
      # change the port to match.
      - "8642:8642"   # API / Web UI
      - "8643:8643"   # reserved; nothing listens on it (it only appears in the CORS allowed origins)
      #
      # Gateway platform webhook callback ports: each platform listens on its own port
      # and none of them go through 8643.
      # Only uncomment the platform you actually use; delete the whole line for the
      # others, so ports are not exposed needlessly (the callback server must be
      # reachable from the public internet).
      - "8091:8091"   # DingTalk (dingtalk)
      - "8092:8092"   # Feishu (feishu)
      - "8084:8084"   # Discord
      - "8085:8085"   # Slack
      - "8087:8087"   # LINE
      - "8088:8088"   # Teams
      - "8089:8089"   # Google Chat
      - "8090:8090"   # SMS (Twilio)
    environment:
      # TZ matters for the cron entries (`magic cron` / bot routines) and for log
      # timestamps: with TZ=UTC a "0 9 * * *" routine fires at 17:00 Beijing time.
      - TZ=Asia/Shanghai
      #
      # The image already sets BROWSER_HEADLESS=true; it is repeated here because
      # `environment:` is the place people actually look. It is required in a
      # container: there is no X display, and isSandboxedEnvironment() does not
      # detect a plain Alpine container, so Chrome would otherwise try to open a
      # GUI window and fail with "cannot open display".
      - BROWSER_HEADLESS=true
      #
      # Force Chinese/UTF-8 output from tools the agent runs (git log, ls, psql, ...);
      # without it an Alpine container defaults to POSIX locale and mangles CJK.
      - LANG=C.UTF-8
    volumes:
      # Named volume for config. NOTE the ownership trap: Docker creates a named
      # volume root-owned on first use, but the image runs as uid 1000 (USER magic),
      # so the very first start leaves ~/.magic unwritable and `magic setup` cannot
      # save config.json. If that happens, fix it once with:
      #   docker compose run --rm --user root magic \
      #     chown -R magic:magic /home/magic/.magic
      - magic-config:/home/magic/.magic
      #
      # The browser profile gets its OWN volume, separate from the config volume.
      # This is deliberate: it is where the logged-in state of the automation
      # browser lives (cookies, localStorage), it is large and churny, and it must
      # stay writable by uid 1000. Keeping it separate means the config volume can
      # be backed up/restored without dragging browser cache along.
      #
      # Log in once there (see docs/USAGE.zh-CN.md "在服务器上跑自动化浏览器"),
      # e.g. by starting a second container with the noVNC image and a VNC client,
      # or by hand-importing cookies via the browser_get_cookies/browser_set_cookies
      # pair. The session then survives `docker compose up --build`.
      - magic-browser-profile:/home/magic/.magic/browser-profile
    networks:
      - magic-network
    healthcheck:
      # Kept in sync with the HEALTHCHECK in the Dockerfile (curl is installed in the image).
      #
      # Correcting an earlier conclusion: a comment here used to claim that `/api/health`
      # does not support HEAD and that `wget --spider` therefore produced false alarms.
      # The source says otherwise --
      #   internal/server/server.go: mux.HandleFunc("/api/health", withCORS(s.handleHealth))
      #   internal/server/health.go:  the handler never reads r.Method; GET and HEAD both return 200
      # so the probe method itself is not a "method not supported" problem. If a container
      # ever shows unhealthy, it is more likely the probe tool (busybox wget version
      # differences) or startup timing; that needs to be measured, do not keep blaming
      # "HEAD is unsupported".
      #
      # start_period is 10s here (5s in the image) to allow the first ~/.magic initialization.
      test: ["CMD", "curl", "-sf", "http://localhost:8642/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # This project uses no Redis / external cache service:
  #   - persistence goes through SQLite (modernc.org/sqlite, pure Go, no CGO)
  #   - the cache is an in-process map (InMemoryToolCache / TTLCache in internal/tool/cache.go)
  #   - go.mod has no Redis client dependency and no code in the repository references 6379
  # There used to be a redis service here, but the code never connected to it, so it was an
  # orphan service: it only started a container and occupied a data volume for nothing, and
  # needed a loopback-only bind to work around its default lack of authentication.
  # If it is ever reintroduced, make the code actually use it first, then add it back.

networks:
  magic-network:
    driver: bridge

volumes:
  magic-config:
  magic-browser-profile:
